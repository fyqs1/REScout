name: REScout
options:
  bundleIdPrefix: com.fyqs
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.fyqs.REScout
    PRODUCT_NAME: REScout
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ONLY_ACTIVE_ARCH: "NO"
    SUPPORTS_MACCATALYST: "NO"
targets:
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fyqs.REScout.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @executable_path/../../Frameworks"
        ENABLE_BITCODE: "NO"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: NetworkExtension.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: REScout Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

  REScout:
    type: application
    platform: iOS
    sources:
      - path: REScout
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: REScout/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        ENABLE_BITCODE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: REScout/REScout-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lresolv"
        CODE_SIGN_ENTITLEMENTS: REScout/REScout.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/System/Library/Frameworks"
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: AdSupport.framework
      - sdk: AppTrackingTransparency.framework
      - sdk: CoreTelephony.framework
      - sdk: CoreLocation.framework
      - sdk: NetworkExtension.framework
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
    info:
      path: REScout/Info.plist
      properties:
        CFBundleDisplayName: REScout
        UILaunchScreen: {}
        NSUserTrackingUsageDescription: Used only to display advertising identifier status. No ads are shown.
        NSLocationWhenInUseUsageDescription: Location permission is required by iOS to show the current Wi-Fi name (SSID).
        NSLocalNetworkUsageDescription: Used to read local network interface information.
        NSPhotoLibraryUsageDescription: Only used to show photo library permission status in Settings.
        NSMicrophoneUsageDescription: Only used to show microphone permission status in Settings.
        NSCameraUsageDescription: Only used to show camera permission status in Settings.
        LSApplicationQueriesSchemes:
          - cydia
          - sileo
          - zbra
          - filza
          - undecimus
          - activator
        NSUserActivityTypes:
          - com.fyqs.REScout.fileBrowser
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
